<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝔛𝔖𝔜𝔑𝔄𝔈𝔗ℌ𝔈𝔛 Aİ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f1f5f9;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 40%);
        }

        .brand-font {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid #818cf8;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-card {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cyber-button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .cyber-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
            display: none;
        }

        .cyber-button:hover::after {
            display: block;
            left: 100%;
        }
    </style>
</head>
<body class="min-h-screen selection:bg-indigo-500/30">

    <div class="max-w-5xl mx-auto px-4 py-16">
        <!-- Header -->
        <div class="text-center mb-16">
            <h1 class="text-5xl md:text-7xl font-bold tracking-tighter mb-6 brand-font">
                <span class="bg-gradient-to-b from-white via-indigo-200 to-indigo-500 bg-clip-text text-transparent">
                    𝔛𝔖𝔜𝔑𝔄𝔈𝔗ℌ𝔈𝔛 Aİ
                </span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light tracking-wide">
                Geleceğin bilgi işleme ve görselleştirme motoru.
            </p>
        </div>

        <!-- Main Interface -->
        <div class="glass-panel rounded-[2.5rem] p-8 md:p-10 mb-10">
            <div class="space-y-8">
                <div class="relative">
                    <textarea 
                        id="userInput" 
                        placeholder="Sistem komutu girin veya bir hayal kurun..."
                        class="w-full h-48 bg-slate-950/40 border border-slate-800 rounded-3xl p-6 text-slate-100 placeholder:text-slate-600 focus:outline-none input-glow transition-all resize-none text-xl leading-relaxed"
                    ></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <button onclick="handleQuery('text')" id="textBtn" class="cyber-button group flex items-center justify-center gap-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-5 px-8 rounded-2xl transition-all active:scale-95 shadow-lg shadow-indigo-500/20">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        Zekayı Çalıştır
                    </button>
                    
                    <button onclick="handleQuery('search')" id="searchBtn" class="cyber-button group flex items-center justify-center gap-3 bg-slate-800 hover:bg-slate-700 text-white font-bold py-5 px-8 rounded-2xl transition-all active:scale-95 border border-slate-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        Ağı Tara
                    </button>
                    
                    <button onclick="handleQuery('image')" id="imageBtn" class="cyber-button group flex items-center justify-center gap-3 bg-white hover:bg-slate-200 text-slate-950 font-bold py-5 px-8 rounded-2xl transition-all active:scale-95 shadow-lg shadow-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        Görselleştir
                    </button>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-16">
            <div class="loader mb-6"></div>
            <p class="text-indigo-400 font-bold tracking-widest text-sm uppercase animate-pulse">Veri İşleniyor...</p>
        </div>

        <!-- Results Display -->
        <div id="resultArea" class="hidden space-y-10 result-card">
            <!-- Text Result -->
            <div id="textContent" class="glass-panel rounded-[2rem] p-10 hidden border-l-4 border-indigo-500">
                <div class="flex items-center justify-between mb-8">
                    <h2 id="resultTitle" class="text-2xl font-bold brand-font text-indigo-300">İşlem Çıktısı</h2>
                    <button onclick="copyToClipboard()" class="text-xs bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 px-5 py-2.5 rounded-xl border border-indigo-500/20 transition-all uppercase tracking-tighter font-bold">
                        Metni Kopyala
                    </button>
                </div>
                <div id="mainOutput" class="text-slate-200 text-xl leading-relaxed whitespace-pre-wrap font-light"></div>
                
                <div id="sources" class="mt-12 pt-8 border-t border-slate-800 hidden">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-6">Veri Kaynakları</h3>
                    <div id="sourceList" class="flex flex-wrap gap-3"></div>
                </div>
            </div>

            <!-- Image Result -->
            <div id="imageContainer" class="glass-panel rounded-[2rem] p-6 hidden flex flex-col items-center">
                <img id="generatedImage" class="rounded-2xl max-w-full h-auto shadow-2xl border border-white/5" alt="Generated Output">
                <div class="mt-6 flex items-center gap-2 text-slate-500 text-sm italic font-medium">
                    <span class="w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></span>
                    Imagen 4.0 Pro Engine
                </div>
            </div>
        </div>

        <footer class="mt-24 text-center">
            <div class="inline-block px-6 py-2 rounded-full border border-slate-800 text-slate-600 text-xs font-medium uppercase tracking-[0.2em]">
                𝔛𝔖𝔜𝔑𝔄𝔈𝔗ℌ𝔈𝔛 Protocol v2.4
            </div>
        </footer>
    </div>

    <script>
        const apiKey = ""; 

        async function handleQuery(type) {
            const input = document.getElementById('userInput').value.trim();
            if (!input) return;

            setLoading(true);
            resetDisplay();

            try {
                if (type === 'image') {
                    await generateImage(input);
                } else {
                    await fetchText(input, type === 'search');
                }
            } catch (err) {
                console.error(err);
            } finally {
                setLoading(false);
            }
        }

        async function fetchText(prompt, useSearch) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { 
                    parts: [{ text: "Sen 𝔛𝔖𝔜𝔑𝔄𝔈𝔗ℌ𝔈𝔛 Aİ isimli üst düzey bir yapay zekasın. Yanıtların profesyonel, analitik ve etkileyici olmalı. Kullanıcıya aga diye hitap et." }] 
                }
            };
            if (useSearch) payload.tools = [{ "google_search": {} }];

            const response = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const grounding = data.candidates?.[0]?.groundingMetadata?.groundingAttributions;
            showTextResult(text, grounding, useSearch ? "Küresel Veri Taraması" : "Merkezi İşlem Birimi");
        }

        async function generateImage(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
            const response = await fetchWithRetry(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ instances: { prompt: prompt }, parameters: { sampleCount: 1 } })
            });
            const data = await response.json();
            if (data.predictions?.[0]?.bytesBase64Encoded) {
                showImageResult(`data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`);
            }
        }

        async function fetchWithRetry(url, options, retries = 5) {
            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, options);
                    if (res.ok) return res;
                } catch (e) {}
                await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
            }
            throw new Error("Sistem Hatası");
        }

        function setLoading(isLoading) {
            document.getElementById('loading').classList.toggle('hidden', !isLoading);
            document.querySelectorAll('button').forEach(b => b.disabled = isLoading);
        }

        function resetDisplay() {
            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('textContent').classList.add('hidden');
            document.getElementById('imageContainer').classList.add('hidden');
            document.getElementById('sources').classList.add('hidden');
        }

        function showTextResult(content, grounding, title) {
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('textContent').classList.remove('hidden');
            document.getElementById('resultTitle').innerText = title;
            document.getElementById('mainOutput').innerText = content;
            if (grounding && grounding.length > 0) {
                const list = document.getElementById('sourceList');
                list.innerHTML = "";
                grounding.forEach(item => {
                    const a = document.createElement('a');
                    a.href = item.web?.uri;
                    a.target = "_blank";
                    a.className = "bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 text-[10px] font-bold py-2 px-4 rounded-lg border border-indigo-500/10 transition-all uppercase tracking-wider";
                    a.innerText = item.web?.title || "Veri Noktası";
                    list.appendChild(a);
                });
                document.getElementById('sources').classList.remove('hidden');
            }
        }

        function showImageResult(url) {
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('imageContainer').classList.remove('hidden');
            document.getElementById('generatedImage').src = url;
        }

        function copyToClipboard() {
            const text = document.getElementById('mainOutput').innerText;
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            alert("Veri panoya aktarıldı, aga!");
        }
    </script>
</body>
</html>
